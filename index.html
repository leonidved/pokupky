<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<title>Покупки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='56' text-anchor='middle'>🛒</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='56' text-anchor='middle'>🛒</text></svg>">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1a1a1a;--muted:#888;--accent:#2563eb;--danger:#ef4444;--border:#e5e7eb;--chip:#e2e8f0;--priv:#7c3aed}
[data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--text:#f3f4f6;--muted:#6b7280;--accent:#3b82f6;--danger:#f87171;--border:#2e2e2e;--chip:#2a2a2a;--priv:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding:14px;max-width:600px;margin:0 auto;padding-bottom:90px;transition:.2s}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.title{display:flex;align-items:center;gap:8px}
h1{font-size:21px}
.dot{width:11px;height:11px;border-radius:50%;background:#f59e0b;cursor:pointer;transition:.3s}
.dot.ok{background:#10b981}
.btns{display:flex;gap:6px}
.ibtn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:11px;font-size:15px;cursor:pointer}
.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:12px;gap:4px}
.tab{flex:1;border:none;background:none;color:var(--muted);padding:9px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.tab.active{background:var(--accent);color:#fff}
.tab.active.priv{background:var(--priv);color:#fff}
.row{display:flex;gap:6px;margin-bottom:8px}
textarea{flex:1;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;font-size:16px;height:46px;resize:none;outline:none}
select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:0 6px;font-size:13px;outline:none;max-width:95px}
.add{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:0 18px;font-size:24px;font-weight:700;cursor:pointer}
.priv-mode .add{background:var(--priv)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--chip);color:var(--text);border:none;border-radius:20px;padding:5px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.ctrl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.clr{background:none;border:none;color:var(--danger);font-weight:700;cursor:pointer}
.cat-h{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px 4px;text-transform:uppercase}
ul{list-style:none;display:flex;flex-direction:column;gap:8px}
li{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 12px;display:flex;align-items:center;gap:8px;transition:.25s}
.main{flex:1;cursor:pointer}
.it-t{font-size:16px;font-weight:500;word-break:break-word}
.it-m{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:8px;align-items:center}
.ptag{color:var(--accent);font-weight:700;cursor:pointer;background:var(--bg);padding:2px 6px;border-radius:6px}
.qty{display:flex;align-items:center;gap:3px;background:var(--bg);padding:3px 5px;border-radius:10px;border:1px solid var(--border)}
.qbtn{background:none;border:none;color:var(--accent);font-size:17px;font-weight:700;width:22px;cursor:pointer}
.qval{font-size:12px;font-weight:700;min-width:34px;text-align:center;cursor:pointer}
.sbtn{background:none;border:none;color:var(--muted);font-size:15px;padding:5px;cursor:pointer}
li.bought{opacity:.42;filter:blur(.6px);background:transparent}
li.bought .it-t{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);margin-top:35px}
.bbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-around;font-size:13px;max-width:600px;margin:0 auto}
.bbar b{color:var(--accent);font-size:15px}
.pbox{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;margin-top:20px}
.pinp{font-size:24px;letter-spacing:8px;text-align:center;width:150px;padding:10px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin:12px 0}
.pbtn{background:var(--priv);color:#fff;border:none;padding:10px 24px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="title"><h1>🛒 Покупки</h1><div class="dot" id="dot" onclick="alert(stMsg)"></div></div>
  <div class="btns">
    <button type="button" class="ibtn" id="ubtn" onclick="chUser()">👤 Я</button>
    <button type="button" class="ibtn" onclick="share()">📤</button>
    <button type="button" class="ibtn" id="tbtn" onclick="tTheme()">🌙</button>
  </div>
</header>
<div class="tabs">
  <button type="button" class="tab active" id="tFam" onclick="swTab('family')">👨‍👩‍👧‍👦 Сімейний</button>
  <button type="button" class="tab" id="tPriv" onclick="swTab('private')">🔒 Моє (Особисте)</button>
</div>
<div id="pScr" style="display:none" class="pbox">
  <h3>🔒 Особистий розділ</h3>
  <input type="password" inputmode="numeric" maxlength="4" id="pInp" class="pinp" placeholder="••••"><br>
  <button type="button" class="pbtn" onclick="chkPin()">Відкрити</button>
</div>
<div id="appB">
  <div class="row">
    <textarea id="inp" placeholder="Товар або список..."></textarea>
    <select id="catS">
      <option value="📦 Інше">📦 Відділ</option>
      <option value="🥦 Овочі">🥦 Овочі</option>
      <option value="🥛 Молочне">🥛 Молочне</option>
      <option value="🥩 М'ясо">🥩 М'ясо</option>
      <option value="🥖 Хліб">🥖 Хліб</option>
      <option value="🧴 Побут">🧴 Побут</option>
    </select>
    <button type="button" class="add" onclick="add()">+</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="ctrl" id="ctrl" style="display:none">
    <span id="cnt">Залишилось: 0</span>
    <div>
      <button type="button" class="clr" id="pinB" style="display:none;color:var(--priv);margin-right:10px" onclick="setPin()">🔑 PIN</button>
      <button type="button" class="clr" onclick="clrB()">Очистити куплене</button>
    </div>
  </div>
  <div id="lCon"></div>
  <div class="empty" id="emp">Список порожній</div>
</div>
<div class="bbar" id="bBar" style="display:none">
  <span>У кошику: <b id="sB">0 грн</b></span>
  <span>Залишилось: <b id="sL">0 грн</b></span>
  <span>Разом: <b id="sT">0 грн</b></span>
</div>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwQ30aN5QVGLiq7ykVkGcv7koxpZYQdddF281JDn4UgXOCT9eE2sl6LAiCKWAuWvJvJ-g/exec";
let fam = JSON.parse(localStorage.getItem('s_items') || '[]');
let prv = JSON.parse(localStorage.getItem('s_prv') || '[]');
let hist = JSON.parse(localStorage.getItem('s_hist') || '["Хліб","Молоко","Яйця","Масло","Вода","Сир"]');
let theme = localStorage.getItem('s_theme') || 'light';
let usr = localStorage.getItem('s_usr') || '';
let pin = localStorage.getItem('s_pin') || '';
let mode = 'family', unl = false, busy = false, stMsg = "Підключення...";

function vib(ms=25){ if(navigator.vibrate) navigator.vibrate(ms); }
function initU(){
  if(!usr){ const c = prompt("Хто користується телефоном? (Тато, Дружина, Син)", "Тато"); usr = (c && c.trim()) ? c.trim() : "Я"; localStorage.setItem('s_usr', usr); }
  document.getElementById('ubtn').textContent = '👤 ' + usr;
}
function chUser(){ const c = prompt("Змінити ім'я:", usr); if(c && c.trim()){ usr = c.trim(); localStorage.setItem('s_usr', usr); document.getElementById('ubtn').textContent = '👤 ' + usr; } }
function setTheme(){ document.documentElement.setAttribute('data-theme', theme); document.getElementById('tbtn').textContent = theme==='dark'?'☀️':'🌙'; }
function tTheme(){ theme = theme==='light'?'dark':'light'; localStorage.setItem('s_theme', theme); setTheme(); }
function swTab(m){
  vib(15); mode = m;
  document.getElementById('tFam').className = m==='family'?'tab active':'tab';
  document.getElementById('tPriv').className = m==='private'?'tab active priv':'tab';
  document.body.className = m==='private'?'priv-mode':'';
  document.getElementById('pinB').style.display = m==='private'?'inline':'none';
  if(m==='private' && pin && !unl){
    document.getElementById('appB').style.display='none'; document.getElementById('bBar').style.display='none';
    document.getElementById('pScr').style.display='block'; document.getElementById('pInp').value='';
  } else {
    document.getElementById('pScr').style.display='none'; document.getElementById('appB').style.display='block'; draw();
  }
}
function chkPin(){
  if(document.getElementById('pInp').value === pin){ unl = true; vib(30); swTab('private'); }
  else { alert("Невірний PIN!"); document.getElementById('pInp').value=''; }
}
function setPin(){
  const p = prompt("Новий 4-значний PIN (або порожньо, щоб вимкнути):", pin);
  if(p === null) return;
  const c = p.replace(/\D/g,'').slice(0,4);
  if(c.length===4){ pin=c; localStorage.setItem('s_pin', pin); unl=true; alert("PIN встановлено!"); }
  else if(!c.length){ pin=''; localStorage.removeItem('s_pin'); alert("PIN вимкнено."); }
  else alert("Введіть 4 цифри.");
}
function cur(){ return mode==='family'?fam:prv; }
function save(){
  if(mode==='private'){ localStorage.setItem('s_prv', JSON.stringify(prv)); draw(); return; }
  busy = true; localStorage.setItem('s_items', JSON.stringify(fam)); draw();
  fetch(GAS_URL + "?data=" + encodeURIComponent(JSON.stringify(fam)))
    .then(r=>{ document.getElementById('dot').className=r.ok?'dot ok':'dot'; stMsg=r.ok?"Google Хмара ОК":"Помилка: "+r.status; busy=false; })
    .catch(e=>{ document.getElementById('dot').className='dot'; stMsg="Помилка: "+e.message; busy=false; });
}
function sync(){
  if(busy) return;
  fetch(GAS_URL + "?t=" + Date.now())
    .then(r=>{ document.getElementById('dot').className=r.ok?'dot ok':'dot'; stMsg=r.ok?"Google Хмара ОК":"Помилка: "+r.status; return r.json(); })
    .then(a=>{ if(Array.isArray(a) && JSON.stringify(a)!==JSON.stringify(fam)){ fam=a; localStorage.setItem('s_items', JSON.stringify(fam)); if(mode==='family') draw(); } })
    .catch(e=>{ document.getElementById('dot').className='dot'; stMsg="Помилка: "+e.message; });
}
function drawChips(){
  const c = document.getElementById('chips'); c.innerHTML='';
  hist.forEach(h=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent='+ '+h;
    b.onclick=()=>{ vib(20); cur().unshift({id:Date.now()+Math.random(),t:h,q:1,u:'шт',p:0,cat:'📦 Інше',who:usr,b:false}); save(); };
    c.appendChild(b);
  });
}
function add(){
  const el=document.getElementById('inp'), cat=document.getElementById('catS').value;
  const lines=el.value.split(/\r?\n/).map(s=>s.replace(/^[-*•\d.)]+\s*/,'').trim()).filter(Boolean);
  if(!lines.length) return; vib(25);
  lines.forEach((t,i)=>{
    cur().unshift({id:Date.now()+i+Math.random(),t,q:1,u:'шт',p:0,cat,who:usr,b:false});
    if(mode==='family'){ hist=[t,...hist.filter(x=>x.toLowerCase()!==t.toLowerCase())].slice(0,12); localStorage.setItem('s_hist',JSON.stringify(hist)); drawChips(); }
  });
  el.value=''; save();
}
function tog(id){ vib(30); cur().forEach(x=>{if(x.id===id)x.b=!x.b;}); save(); }
function chQ(id,d,e){ e.stopPropagation(); vib(15); cur().forEach(x=>{if(x.id===id&&(x.q+d)>=1)x.q+=d;}); save(); }
function chU(id,e){ e.stopPropagation(); vib(15); const u=['шт','кг','г','л','уп']; cur().forEach(x=>{if(x.id===id)x.u=u[(u.indexOf(x.u)+1)%u.length];}); save(); }
function setP(id,e){ e.stopPropagation(); const it=cur().find(x=>x.id===id), v=prompt(`Ціна за 1 ${it.u} (грн):`, it.p||''); if(v!==null){ const n=parseFloat(v.replace(',','.')); it.p=isNaN(n)||n<0?0:n; save(); } }
function ed(id,e){ e.stopPropagation(); const it=cur().find(x=>x.id===id), nt=it&&prompt('Назва:',it.t); if(nt&&nt.trim()){it.t=nt.trim();save();} }
function del(id,e){ e.stopPropagation(); vib(20); if(mode==='family') fam=fam.filter(x=>x.id!==id); else prv=prv.filter(x=>x.id!==id); save(); }
function clrB(){ vib(30); if(mode==='family') fam=fam.filter(x=>!x.b); else prv=prv.filter(x=>!x.b); save(); }
function share(){
  const act=cur().filter(x=>!x.b); if(!act.length) return alert('Немає активних покупок');
  const txt=(mode==='family'?'🛒 Сімейні покупки:\n':'🔒 Мій список:\n')+act.map(x=>`- ${x.t} (${x.q} ${x.u})`).join('\n');
  navigator.share?navigator.share({text:txt}):(navigator.clipboard.writeText(txt),alert('Скопійовано!'));
}
function draw(){
  const list=cur(), con=document.getElementById('lCon'), emp=document.getElementById('emp'), ctrl=document.getElementById('ctrl'), bar=document.getElementById('bBar');
  con.innerHTML='';
  if(!list.length){ emp.style.display='block'; ctrl.style.display='none'; bar.style.display='none'; return; }
  emp.style.display='none'; ctrl.style.display='flex';
  document.getElementById('cnt').textContent='Залишилось: '+list.filter(x=>!x.b).length;
  let sb=0, sl=0; list.forEach(x=>{ const c=(x.p||0)*(x.q||1); if(x.b) sb+=c; else sl+=c; });
  if(sb>0||sl>0){ bar.style.display='flex'; document.getElementById('sB').textContent=Math.round(sb)+' грн'; document.getElementById('sL').textContent=Math.round(sl)+' грн'; document.getElementById('sT').textContent=Math.round(sb+sl)+' грн'; }
  else bar.style.display='none';
  const act=list.filter(x=>!x.b), bgt=list.filter(x=>x.b), cats=[...new Set(act.map(x=>x.cat||'📦 Інше'))];
  cats.forEach(c=>{
    const grp=act.filter(x=>(x.cat||'📦 Інше')===c);
    if(cats.length>1||c!=='📦 Інше'){ const h=document.createElement('div'); h.className='cat-h'; h.textContent=c; con.appendChild(h); }
    const ul=document.createElement('ul'); grp.forEach(x=>ul.appendChild(mkLi(x))); con.appendChild(ul);
  });
  if(bgt.length){ const h=document.createElement('div'); h.className='cat-h'; h.textContent='✅ У кошику'; con.appendChild(h); const ul=document.createElement('ul'); bgt.forEach(x=>ul.appendChild(mkLi(x))); con.appendChild(ul); }
}
function mkLi(x){
  const li=document.createElement('li'); if(x.b) li.className='bought';
  const pt=x.p>0?`${Math.round(x.p*x.q)} грн`:'+ ціна', wt=(mode==='family'&&x.who)?`<span>👤 ${x.who}</span>`:'';
  li.innerHTML=`<div class="main" onclick="tog(${x.id})"><div class="it-t">${x.t}</div><div class="it-m">${wt}<span class="ptag" onclick="setP(${x.id},event)">💰 ${pt}</span></div></div>
    <div class="qty"><button type="button" class="qbtn" onclick="chQ(${x.id},-1,event)">-</button><span class="qval" onclick="chU(${x.id},event)">${x.q} ${x.u}</span><button type="button" class="qbtn" onclick="chQ(${x.id},1,event)">+</button></div>
    <button type="button" class="sbtn" onclick="ed(${x.id},event)">✏️</button><button type="button" class="sbtn" onclick="del(${x.id},event)">✕</button>`;
  return li;
}
document.getElementById('inp').addEventListener('paste',()=>setTimeout(add,50));
initU(); setTheme(); drawChips(); draw(); sync(); setInterval(sync,4000);
</script>
</body>
</html>
